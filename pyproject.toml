[project]
name = "live-political-analysis"
version = "0.1.0"
description = "Malaysian political sentiment tracker and GE16 coalition seat projection"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]
sentiment = ["transformers>=4.40", "torch>=2.0", "sentencepiece>=0.2", "protobuf>=4.0"]
dashboard = ["streamlit>=1.37", "pandas>=2.0", "altair>=5.0"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpa"]

[tool.hatch.build.targets.wheel.force-include]
"data/coalitions.json" = "lpa/data/coalitions.json"
"data/outlets.json" = "lpa/data/outlets.json"
"data/state_elections.json" = "lpa/data/state_elections.json"
"data/poll_calibration.json" = "lpa/data/poll_calibration.json"
"data/election_status.json" = "lpa/data/election_status.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not model and not network'"
markers = [
    "model: needs the self-hosted sentiment model; downloads weights and runs CPU inference",
    "network: makes a real HTTP request; run with `pytest -m network`",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs", "public", "scripts"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# The Streamlit dashboard is the one untyped surface in the package, and by
# design has no automated tests (issue #1) — it is verified by running the
# pipeline and looking at the page. It is also the only importer of
# pandas/altair, so excluding it keeps the type-check on the model code,
# which is where a type error costs something, without dragging in the
# pandas/numpy stub layer. Typing it is a later, separate piece of work.
exclude = ["src/lpa/dashboard.py"]
# Type-check this package, not the bodies of its third-party dependencies:
# `transformers` pulls in numpy, whose stubs use a Python 3.12-only `type`
# statement that mypy refuses to parse at `python_version = 3.11`. Skipping
# external imports keeps the 3.11-compat check on our own code (matching
# `requires-python`) while leaving the vendor stubs unexamined.
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
