[project]
name = "live-political-analysis"
version = "0.1.0"
description = "Malaysian political sentiment tracker and GE16 coalition seat projection"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
