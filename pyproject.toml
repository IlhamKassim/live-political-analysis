[project]
name = "live-political-analysis"
version = "0.1.0"
description = "Malaysian political sentiment tracker and GE16 coalition seat projection"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sentiment = ["transformers>=4.40", "torch>=2.0", "sentencepiece>=0.2", "protobuf>=4.0"]
dashboard = ["streamlit>=1.37", "pandas>=2.0", "altair>=5.0"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpa"]

[tool.hatch.build.targets.wheel.force-include]
"data/coalitions.json" = "lpa/data/coalitions.json"
"data/outlets.json" = "lpa/data/outlets.json"
"data/state_elections.json" = "lpa/data/state_elections.json"
"data/poll_calibration.json" = "lpa/data/poll_calibration.json"
"data/election_status.json" = "lpa/data/election_status.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not model and not network'"
markers = [
    "model: needs the self-hosted sentiment model; downloads weights and runs CPU inference",
    "network: makes a real HTTP request; run with `pytest -m network`",
]
