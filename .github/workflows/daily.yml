# The daily pipeline: scrape, score, project, store one snapshot (issue #7).
#
# Unattended by requirement (ADR 0002), so it must not need a human on a good
# day and must be re-runnable by hand on a bad one — hence workflow_dispatch
# alongside the schedule. Re-running the same Malaysian day corrects that
# day's row rather than adding a second answer for it, so a manual re-run
# after a failure is always safe.
#
# GitHub disables a scheduled workflow after 60 days with no commits to the
# repository, so a quiet stretch stops the pipeline silently. Re-enable it
# from the Actions tab; any commit resets the clock.
#
# Free on GitHub's hosted runners because the repository is public. Nothing
# here calls a paid API: the sentiment model is downloaded once and cached,
# and inference is local CPU.
name: Daily pipeline

on:
  schedule:
    # 15:00 UTC is 23:00 in Malaysia — late in the Malaysian day, so the
    # snapshot sees nearly all of the coverage it is dated for. The pipeline
    # dates snapshots by the Malaysian day, not UTC (see MALAYSIA_TIME).
    - cron: "0 15 * * *"
  workflow_dispatch:

# Two runs writing the same day's row would race for it. Later wins, because
# the later run has read more of the day.
concurrency:
  group: storage-write
  cancel-in-progress: false

# Read the checkout; the pipeline's only write goes to the database over the
# network, never to the repository. pages/id-token are for the Pages deploy
# step, which publishes the page this workflow renders.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Lets the deploy-pages step report the published URL as this job's
    # environment URL, and is what actions/deploy-pages requires to run.
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache the sentiment model
        # Weights are a few hundred MB and never change for a pinned model
        # name. Without this every run re-downloads them from the Hub, which
        # is slow and is the one step here that depends on a third party
        # being up.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Keyed on the model name, not on the file that names it: any
          # unrelated edit to sentiment.py would otherwise throw away a few
          # hundred MB of weights that had not changed. Update this when
          # DEFAULT_MODEL changes.
          key: huggingface-twitter-xlm-roberta-base-sentiment
          restore-keys: huggingface-

      - name: Install
        # No dashboard extra: that's the Streamlit internal view, unused
        # here. public_page renders server-side HTML/SVG with no extra
        # deps of its own. Postgres extra for the hosted database both the
        # pipeline and public_page read.
        run: pip install -e ".[sentiment,postgres]"

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.pipeline

      - name: Render the public page
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.public_page

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
