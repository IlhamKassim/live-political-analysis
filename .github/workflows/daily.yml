# The daily pipeline: scrape, score, project, store one snapshot (issue #7),
# then render the public page from that snapshot and publish it to GitHub
# Pages (step 8b, docs/design/HANDOFF.md).
#
# Unattended by requirement (ADR 0002), so it must not need a human on a good
# day and must be re-runnable by hand on a bad one — hence workflow_dispatch
# alongside the schedule. Re-running the same Malaysian day corrects that
# day's row rather than adding a second answer for it, so a manual re-run
# after a failure is always safe.
#
# GitHub disables a scheduled workflow after 60 days with no commits to the
# repository, so a quiet stretch stops the pipeline silently. Re-enable it
# from the Actions tab; any commit resets the clock.
#
# Free on GitHub's hosted runners because the repository is public. Nothing
# here calls a paid API: the sentiment model is downloaded once and cached,
# and inference is local CPU.
name: Daily pipeline

on:
  schedule:
    # Hourly, at 7 minutes past the hour rather than the exact top of the
    # hour — this repo's cron-scheduling convention, to avoid piling onto
    # the thundering herd of jobs GitHub's shared runners see at :00. The
    # pipeline still dates snapshots by the Malaysian day, not UTC (see
    # MALAYSIA_TIME): every run within the same Malaysian day just corrects
    # that day's row rather than adding a second one, and the
    # concurrency group below (same reasoning as before, now firing far
    # more often) is what makes that safe.
    - cron: "7 * * * *"
  workflow_dispatch:

# Two runs writing the same day's row would race for it. Later wins, because
# the later run has read more of the day.
concurrency:
  group: storage-write
  cancel-in-progress: false

# contents: write is for the "Archive the dated permalink" step (#55) — the
# pipeline's own writes still go to the database over the network, never the
# repository. pages/id-token are for the Pages deploy step, which publishes
# the page this workflow renders.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Lets the deploy-pages step report the published URL as this job's
    # environment URL, and is what actions/deploy-pages requires to run.
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        # PolitikKu's constituency lookup (#77, ts/) needs Node to build here
        # for the first time — ci.yml's ts-check job already proves this
        # config typechecks/lints/tests/builds; this is the same pin so a
        # build that passes there can't silently differ here.
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json

      - name: Cache the sentiment model
        # Weights are a few hundred MB and never change for a pinned model
        # name. Without this every run re-downloads them from the Hub, which
        # is slow and is the one step here that depends on a third party
        # being up.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/huggingface
          # Keyed on the model name, not on the file that names it: any
          # unrelated edit to sentiment.py would otherwise throw away a few
          # hundred MB of weights that had not changed. Update this when
          # DEFAULT_MODEL changes.
          key: huggingface-twitter-xlm-roberta-base-sentiment
          restore-keys: huggingface-

      - name: Install fonts for #40's card rendering
        # telegram_post.py's aggregate/Seat-anchored card images (via
        # telegram_card.py) need real .ttf files on disk — same step ci.yml
        # already runs, kept in sync with it.
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install
        # No dashboard extra: that's the Streamlit internal view, unused
        # here. public_page renders server-side HTML/SVG with no extra
        # deps of its own. Postgres extra for the hosted database both the
        # pipeline and public_page read. telegram (Pillow) for #40's card
        # rendering — cheap, no system deps beyond the fonts above.
        run: pip install -e ".[sentiment,postgres,telegram]"

      - name: Build the PolitikKu lookup bundle
        # #77/#103: the only client-side build in this pipeline. Independent
        # of Storage and of every step below, so it can run any time after
        # setup-node; placed here, ahead of the pipeline run, so a broken
        # bundle fails fast before the (much slower) pipeline/render steps
        # spend the run's time budget.
        #
        # continue-on-error: same reasoning as "Archive the dated
        # permalink" below — a broken PolitikKu build must not take down
        # the old dashboard's own render/deploy that follows. A stale
        # lookup.js is a worse PolitikKu lookup, not a worse site.
        continue-on-error: true
        working-directory: ts
        run: npm ci && npm run build

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.pipeline

      # The old chamber dashboard's own render step (`python -m
      # lpa.public_page`, which wrote public/index.html and its dated
      # permalinks) was retired here by #104's cutover: PolitikKu's homepage
      # now owns public/index.html, and the dashboard's analytical depth is
      # published by "Render the PolitikKu projection page" below (ADR
      # 0011). `public_page.py` itself is very much still alive — it is
      # where `page_model()` and every figure on both pages is computed, and
      # each PolitikKu step below imports it — it just no longer renders or
      # publishes a page of its own.

      - name: Render the PolitikKu homepage
        # #103: first time any of the PolitikKu pages actually ship. Each
        # module's main() writes both EN and BM in one invocation (the BM
        # variant alongside the EN one, under ms/) and reads Storage the
        # same way public_page used to, so it needs the same DATABASE_URL.
        # Independent of the other PolitikKu steps below — none of these
        # modules import from one another's CLI or read another's output —
        # so their order relative to each other doesn't matter; grouped
        # together here for readability.
        #
        # continue-on-error: this wrote public/index.html (the site root)
        # and was NOT continue-on-error from #104 until the landing-page
        # cutover below. It now writes public/home.html — a secondary
        # "Dashboard" nav page, not the site root — so a bad render here is
        # a worse PolitikKu, not a site that stops updating. The landing
        # page below inherits the strict treatment this step is giving up.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_homepage

      - name: Render the PolitikKu projection and methodology pages
        # #102/#104: the old dashboard's analytical depth, redrawn in
        # PolitikKu's register at /projection/ (plus /methodology.html and
        # both BM variants), and the dated permalinks #55 needs — this one
        # invocation writes all six files. Nothing rendered this page until
        # now; #102 built it while public_page was still the deployed site.
        #
        # Fail-fast for the homepage step's reason: this is where every
        # figure the retired dashboard used to publish now lives, and
        # "Seat Projection" is a nav item on every single PolitikKu page.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_projection

      - name: Render the PolitikKu landing page
        # NOT continue-on-error: this now writes public/index.html, the
        # site root (the landing-page cutover — every visitor lands here
        # first, not on the homepage/dashboard). Same reasoning the
        # homepage step used to state here: that file is gitignored, so a
        # failed render leaves the uploaded artifact with no root page at
        # all rather than yesterday's copy, and deploy-pages replaces the
        # live site wholesale — failing the job instead means the last
        # good deploy stays up, a day-stale site rather than a rootless one.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_landing

      - name: Render the PolitikKu MP profile pages
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_mp_profile

      - name: Render the PolitikKu bills tracker
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_bills

      - name: Render the PolitikKu sentiment page
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_sentiment

      - name: Render the PolitikKu learn pages
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_learn

      - name: Render the PolitikKu lookup index
        # Writes public/data/lookup-index.json, the client-side data the
        # ts/ bundle built above fetches at runtime in the browser — not
        # read by any step in this workflow, so it has no ordering
        # dependency on the bundle build either.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.politikku_lookup_index

      - name: Archive the dated permalink
        # #55: deploy-pages replaces the live site wholesale each run rather
        # than merging into it, so a dated copy that only ever lived in this
        # run's artifact would vanish the moment tomorrow's run deployed —
        # the exact problem #55 exists to solve, one day later. Committing
        # it here means every future run's checkout has every past day's
        # file to publish alongside the new one. Never index.html itself —
        # that stays the ephemeral daily overwrite by design.
        #
        # The glob follows the content: until #104 these files sat beside
        # public/index.html, written by public_page.main. They are now
        # written by politikku_projection.main beside
        # public/projection/index.html — the path `_permalink_url` prints
        # on the page itself, so the citation link and the archived file
        # cannot disagree. Nothing writes the old public/<year>/... paths
        # any more, and no run ever archived one (the PolitikKu pages had
        # not shipped when this step was last exercised), so there is no
        # historical set of files at the old path left behind.
        #
        # continue-on-error: unchanged from the original reasoning above — a
        # failure here (e.g. a push rejected by branch protection, #128)
        # must not take down the actual page deploy that follows. Dropping
        # this to make the failure "loud" would skip every step after it
        # (Configure/Upload/Deploy to GitHub Pages included) on every run
        # from now on, since the push fails every time until #128's root
        # cause is actually fixed — turning one broken citation feature
        # into the whole site never redeploying. The `::warning::` and job
        # summary lines below are the loud part; this flag is what keeps
        # that loudness from being also a site outage.
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(public/projection/[0-9]*/*/*.html public/projection/ms/[0-9]*/*/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No dated permalink to archive."
            exit 0
          fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "Dated permalink unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive the dated permalink (${files[*]})"
          if ! git push; then
            echo "::warning::Git push rejected (likely branch protection). See #128."
            echo "### ⚠️ Archive Push Failed" >> $GITHUB_STEP_SUMMARY
            echo "Failed to push the dated permalink archive to \`main\`. See issue #128." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Export the Projection as JSON/CSV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.public_export

      - name: Render the shareable Seat Call cards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.seat_call_card --all

      - name: Post a Return Trigger to Telegram, if one fired
        # #40: detects whether today is worth a push, composes the post,
        # and sends it — only if TELEGRAM_BOT_TOKEN/TELEGRAM_CHANNEL_ID are
        # both set as repository secrets. Until a bot and channel exist,
        # this step still runs safely: it detects and logs what it would
        # have posted, and always (re)writes public/feed.xml from the full
        # log, but sends nothing. Runs after the Seat Call cards so the
        # Seat-anchored template's dependency (#23) is unambiguous, though
        # nothing here actually reads their output — each step still reads
        # Storage independently.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m lpa.telegram_post

      - name: Fold frontend/ into the Pages artifact
        # #134 (Step 5): the merged-in PolitikKu/mypolitik frontend (frontend/)
        # is a self-contained static app with no build step by design (see
        # frontend/README.md) — this is a plain file copy, not a build. It
        # lands under public/app/, a new subpath, so it never touches the
        # existing root-level public/ content owned by the PolitikKu pages
        # rendered above (ADR 0011). The Cloudflare Worker deploy originally
        # planned alongside this is out of scope here — Cloudflare's own
        # dashboard Git-integration now handles that deploy separately.
        #
        # Runs BEFORE "Generate sitemap": politikku_sitemap.py auto-discovers
        # every public/**/*.html file, including public/app/index.html and
        # public/app/embed.html once they exist — but only if they already
        # exist when it scans. Folding frontend/ in first is what makes
        # /app/ show up in sitemap.xml at all; the reverse order silently
        # produced a sitemap with no /app/ entries, caught by a user asking
        # why the new frontend wasn't showing up for Google.
        run: |
          mkdir -p public/app
          cp -r frontend/public/. public/app/

      - name: Smoke-check the frontend fold-in
        # Loud on purpose (no continue-on-error): a silently-broken copy
        # would ship a Pages artifact with a dead /app/ subtree, and nobody
        # would notice until a visitor did. index.html proves the static
        # app itself copied; data/bills.json proves the data directory
        # (already present in frontend/public/data from a prior merge step)
        # came along with it.
        run: |
          missing=0
          if [ ! -f public/app/index.html ]; then
            echo "::error::public/app/index.html is missing — frontend fold-in failed."
            missing=1
          fi
          if [ ! -f public/app/data/bills.json ]; then
            echo "::error::public/app/data/bills.json is missing — frontend fold-in failed."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Frontend fold-in verified: public/app/index.html and public/app/data/bills.json present."

      - name: Generate sitemap
        continue-on-error: true
        run: python -m lpa.politikku_sitemap

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload the page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
