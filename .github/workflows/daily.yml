# The daily pipeline: scrape, score, project, store one snapshot (issue #7),
# then render the public page from that snapshot and publish it to GitHub
# Pages (step 8b, docs/design/HANDOFF.md).
#
# Unattended by requirement (ADR 0002), so it must not need a human on a good
# day and must be re-runnable by hand on a bad one — hence workflow_dispatch
# alongside the schedule. Re-running the same Malaysian day corrects that
# day's row rather than adding a second answer for it, so a manual re-run
# after a failure is always safe.
#
# GitHub disables a scheduled workflow after 60 days with no commits to the
# repository, so a quiet stretch stops the pipeline silently. Re-enable it
# from the Actions tab; any commit resets the clock.
#
# Free on GitHub's hosted runners because the repository is public. Nothing
# here calls a paid API: the sentiment model is downloaded once and cached,
# and inference is local CPU.
name: Daily pipeline

on:
  schedule:
    # 15:00 UTC is 23:00 in Malaysia — late in the Malaysian day, so the
    # snapshot sees nearly all of the coverage it is dated for. The pipeline
    # dates snapshots by the Malaysian day, not UTC (see MALAYSIA_TIME).
    - cron: "0 15 * * *"
  workflow_dispatch:

# Two runs writing the same day's row would race for it. Later wins, because
# the later run has read more of the day.
concurrency:
  group: storage-write
  cancel-in-progress: false

# contents: write is for the "Archive the dated permalink" step (#55) — the
# pipeline's own writes still go to the database over the network, never the
# repository. pages/id-token are for the Pages deploy step, which publishes
# the page this workflow renders.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Lets the deploy-pages step report the published URL as this job's
    # environment URL, and is what actions/deploy-pages requires to run.
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Cache the sentiment model
        # Weights are a few hundred MB and never change for a pinned model
        # name. Without this every run re-downloads them from the Hub, which
        # is slow and is the one step here that depends on a third party
        # being up.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/huggingface
          # Keyed on the model name, not on the file that names it: any
          # unrelated edit to sentiment.py would otherwise throw away a few
          # hundred MB of weights that had not changed. Update this when
          # DEFAULT_MODEL changes.
          key: huggingface-twitter-xlm-roberta-base-sentiment
          restore-keys: huggingface-

      - name: Install fonts for #40's card rendering
        # telegram_post.py's aggregate/Seat-anchored card images (via
        # telegram_card.py) need real .ttf files on disk — same step ci.yml
        # already runs, kept in sync with it.
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install
        # No dashboard extra: that's the Streamlit internal view, unused
        # here. public_page renders server-side HTML/SVG with no extra
        # deps of its own. Postgres extra for the hosted database both the
        # pipeline and public_page read. telegram (Pillow) for #40's card
        # rendering — cheap, no system deps beyond the fonts above.
        run: pip install -e ".[sentiment,postgres,telegram]"

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.pipeline

      - name: Render the public page
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.public_page

      - name: Archive the dated permalink
        # #55: deploy-pages replaces the live site wholesale each run rather
        # than merging into it, so a dated copy that only ever lived in this
        # run's artifact would vanish the moment tomorrow's run deployed —
        # the exact problem #55 exists to solve, one day later. Committing
        # it here means every future run's checkout has every past day's
        # file to publish alongside the new one. Never index.html itself —
        # that stays the ephemeral daily overwrite by design.
        #
        # continue-on-error: a failure here (e.g. a push rejected by branch
        # protection) must not take down the actual page deploy that
        # follows — a day the archive step fails is a worse citation
        # feature, not a worse site. Untested against this repo's live
        # branch protection as of this change; watch the first few runs.
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(public/[0-9]*/*/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No dated permalink to archive."
            exit 0
          fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "Dated permalink unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive the dated permalink (${files[*]})"
          git push

      - name: Export the Projection as JSON/CSV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.public_export

      - name: Render the shareable Seat Call cards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m lpa.seat_call_card --all

      - name: Post a Return Trigger to Telegram, if one fired
        # #40: detects whether today is worth a push, composes the post,
        # and sends it — only if TELEGRAM_BOT_TOKEN/TELEGRAM_CHANNEL_ID are
        # both set as repository secrets. Until a bot and channel exist,
        # this step still runs safely: it detects and logs what it would
        # have posted, and always (re)writes public/feed.xml from the full
        # log, but sends nothing. Runs after the Seat Call cards so the
        # Seat-anchored template's dependency (#23) is unambiguous, though
        # nothing here actually reads their output — each step still reads
        # Storage independently.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m lpa.telegram_post

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload the page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
