# The code-quality gate: lint, format, type-check, and test on every push to
# main and on every pull request. This is the "industrial" enforcement that
# keeps a regression from merging silently — the runtime pipeline lives in
# daily.yml, this file guards the repo itself.
#
# Runs the same fast, offline suite as local `pytest` (the `model` and
# `network` markers are already excluded by addopts in pyproject.toml), plus
# `ruff` lint/format and `mypy` on `src/`. A failed check blocks the merge.
#
# `mypy` also checks `scripts/deepseek_agent.py` specifically, though the
# rest of `scripts/` stays unchecked (see `pyproject.toml`'s `[tool.ruff]`
# comment and `docs/agents/deepseek-agent.md`'s "Why this repo breaks its
# own pattern" section) — that one script grants a model real shell/file/git
# access, which is `docs/agents/model-effort.md` trigger #4
# (security/correctness-critical engineering), so it gets the same gate as
# the package itself rather than staying manual-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install fonts for #40's card rendering
        # telegram_card.py needs real .ttf files on disk (Pillow draws text
        # from a font file, not a name) — explicit rather than relying on
        # whatever the runner image happens to ship, which GitHub can change
        # without notice. DejaVu is small, stable, and in Ubuntu's own repos
        # rather than a third party.
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install
        # telegram (Pillow) is a cheap, no-system-deps extra installed here
        # unlike sentiment/dashboard's heavy ML/data stacks, so #40's card
        # rendering gets real, non-skipped test coverage rather than a
        # perpetually-excluded marker.
        run: pip install -e ".[dev,telegram]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src scripts/deepseek_agent.py

      - name: Test
        run: pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # Fails the run if Gitleaks finds a committed secret in the diff, so a
    # leaked DATABASE_URL can never merge silently (this repo's one real
    # secret). Pinned to the v3.0.0 commit so a future release cannot change
    # what this gate checks without an explicit bump.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
