<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyPolitik Widget</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Redaction+20&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0f17;
      --card-bg: #121824;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #d7263d;
      --font-sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-serif: 'Redaction 20', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      background: transparent;
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      -webkit-font-smoothing: antialiased;
    }
    .widget-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .widget-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 2;
    }
    .seat-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .seat-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .seat-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
      color: #fff;
    }
    .seat-state {
      font-size: 13px;
      color: var(--text-muted);
    }
    .seat-silhouette-wrap {
      width: 64px;
      height: 64px;
      position: relative;
      flex-shrink: 0;
      filter: drop-shadow(0 0 12px var(--accent));
      opacity: 0.88;
    }
    .seat-silhouette-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .rep-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 14px;
      position: relative;
      z-index: 2;
    }
    .rep-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      background: #1e293b;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-muted);
    }
    .rep-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .rep-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .rep-kicker {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .rep-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .party-pill {
      align-self: flex-start;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      margin-top: 2px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: relative;
      z-index: 2;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
      font-family: var(--font-mono);
    }
    .widget-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 2px;
      position: relative;
      z-index: 2;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
    }
    .brand-mark {
      width: 8px;
      height: 14px;
      background: #eef5fb;
      border-radius: 1px;
      display: inline-block;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .cta-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .loading-state, .error-state {
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="widget-container" class="widget-card">
    <div class="loading-state">Loading seat data…</div>
  </div>
  <script type="module" src="embed.js"></script>
</body>
</html>
